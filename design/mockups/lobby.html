<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大厅 · ROFT-DLC</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* ---- 大厅：单列牌桌，灯池落在开局卡上 ---- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-3);
    padding: var(--sp-3);
    border-bottom: var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: var(--sp-2); }
  .brand b {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--brass);
  }
  .brand span { font-family: var(--font-display); font-size: 15px; color: var(--text-secondary); }
  .me { display: flex; align-items: center; gap: var(--sp-2); font-size: 14px; }
  /* 开场：扇形牌 + 一句话定位 */
  .hero { padding: var(--sp-5) 0 var(--sp-4); text-align: center; }
  /* 全页唯一的画面：五张牌摊在最上面。牌放大一档、叠得更紧，
     进门第一眼就知道这是张牌桌（--card-w 一改，牌面字号跟着等比走） */
  .cardfan { display: flex; justify-content: center; margin-bottom: var(--sp-4); height: 104px; }
  /* 叠 8px 就够：再往里收，中间三张的大字会被邻牌盖掉，扇形就成了一团 */
  .cardfan .card { --card-w: 62px; --card-h: 93px; margin: 0 -8px; transform-origin: 50% 120%; }
  .cardfan .card:nth-child(1) { transform: rotate(-14deg) translateY(6px); }
  .cardfan .card:nth-child(2) { transform: rotate(-7deg) translateY(1px); }
  .cardfan .card:nth-child(3) { transform: rotate(0deg) translateY(-3px); }
  .cardfan .card:nth-child(4) { transform: rotate(7deg) translateY(1px); }
  .cardfan .card:nth-child(5) { transform: rotate(14deg) translateY(6px); }
  .hero h1 { font-size: clamp(28px, 9vw, 40px); line-height: 1.2; }
  .hero p { margin: var(--sp-2) 0 0; color: var(--text-secondary); }

  .cols { display: grid; gap: var(--sp-3); }
  @media (min-width: 760px) { .cols { grid-template-columns: 1.4fr 1fr; align-items: start; } }

  /* 规则包选项：整块可点，≥ 56px。选中态是**选牌**的感觉——边亮、底染、微微抬起 */
  .opt {
    display: block;
    min-height: 56px;
    padding: var(--sp-2) var(--sp-3);
    border: 1px solid var(--edge);
    border-radius: var(--radius-card);
    background: var(--surface-2);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    cursor: pointer;
    transition: border-color 0.16s ease, background 0.16s ease, transform 0.09s var(--ease-tactile);
  }
  .opt:hover { border-color: var(--piao-dim); }
  .opt:active { transform: translateY(1px); }
  .opt + .opt { margin-top: var(--sp-2); }
  .opt input { accent-color: var(--brass); margin-right: var(--sp-2); }
  .opt-title { font-family: var(--font-display); font-size: 16px; }
  .opt-note { display: block; margin-left: 24px; font-size: 13px; color: var(--text-secondary); }
  .opt:has(input:checked) {
    border-color: var(--piao);
    background: rgba(99, 210, 195, 0.1);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 6px 18px -14px var(--piao);
  }

  fieldset { margin: 0 0 var(--sp-3); padding: 0; border: 0; }
  legend { padding: 0 0 var(--sp-2); font-size: 13px; color: var(--text-secondary); }

  .fixed-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 48px;
    padding: 0 var(--sp-3);
    border: 1px dashed var(--edge);
    border-radius: var(--radius-card);
    color: var(--text-secondary);
  }
  .fixed-row b { color: var(--text-primary); font-weight: 600; }

  .code-input {
    width: 100%;
    min-height: 56px;
    padding: 0 var(--sp-3);
    border: 1px solid var(--brass-dim);
    border-radius: var(--radius-card);
    background: var(--surface-sunken);
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 24px;
    letter-spacing: 0.32em;
    text-align: center;
    text-transform: uppercase;
  }
  .code-input::placeholder { color: #55637a; letter-spacing: 0.32em; }
  .code-input:focus { border-color: var(--piao); box-shadow: 0 0 0 3px rgba(99, 210, 195, 0.14); outline: none; }

  .btn--block { width: 100%; margin-top: var(--sp-3); }

  .more {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-3);
    min-height: 56px;
    margin-top: var(--sp-4);
    padding: var(--sp-2) var(--sp-3);
    border: var(--line);
    border-radius: var(--radius-panel);
    color: var(--text-primary);
    text-decoration: none;
    transition: border-color 0.16s ease, background 0.16s ease;
  }
  .more:hover { border-color: var(--piao-dim); background: var(--surface-2); }
  .more:hover .arrow { color: var(--piao); }
  .more .arrow { color: var(--brass); font-family: var(--font-mono); }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><b>ROFT-DLC</b><span>诸神降临 4.1</span></div>
  <div class="me"><span class="dot"></span>凛</div>
</header>

<main class="wrap">

  <section class="hero">
    <div class="cardfan" aria-hidden="true">
      <span class="card" data-color="green" data-face="7"></span>
      <span class="card" data-color="yellow" data-face="+2"></span>
      <span class="card" data-color="wild" data-face="+4"></span>
      <span class="card" data-color="red" data-face="停"></span>
      <span class="card" data-color="blue" data-face="3"></span>
    </div>
    <h1>今晚坐哪一桌？</h1>
    <p>3–4 人，一人一个技能，亮出来才生效。</p>
  </section>

  <div class="cols">

    <section class="panel">
      <p class="eyebrow">开一桌</p>
      <h2>创建房间</h2>
      <hr class="rail">

      <fieldset>
        <legend>规则包</legend>
        <label class="opt">
          <input type="radio" name="pack" value="base" checked>
          <span class="opt-title">基础包</span>
          <small class="opt-note">UNO 牌 + 首批 10 个技能。</small>
        </label>
        <label class="opt">
          <input type="radio" name="pack" value="gods">
          <span class="opt-title">诸神包</span>
          <small class="opt-note">进阶内容，建议先玩过基础包。</small>
        </label>
      </fieldset>

      <fieldset>
        <legend>技能获取</legend>
        <div class="fixed-row"><b>抽 3 选 1</b><span class="hint">本版本固定</span></div>
      </fieldset>

      <button class="btn btn--primary btn--block">创建房间</button>
    </section>

    <section class="panel">
      <p class="eyebrow">加入一桌</p>
      <h2>加入房间</h2>
      <hr class="rail">
      <label for="code" class="hint">输入房主给的 6 位房间码</label>
      <input id="code" class="code-input" type="text" maxlength="6" value="KX7Q2M" placeholder="KX7Q2M" autocomplete="off" spellcheck="false">
      <button class="btn btn--block">加入房间</button>
    </section>

  </div>

  <a class="more" href="encyclopedia.html">
    <span>
      玩家百科
      <small class="opt-note" style="margin:0">四句总则、10 个技能的细则与例子。</small>
    </span>
    <span class="arrow">→</span>
  </a>

</main>

</body>
</html>
